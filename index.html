<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1a">
<title>NEON 777 CRUISE</title>
<style>
:root{
  --sym:min(17vw,84px);
  --bg1:#070a1a; --bg2:#0d1230;
  --txt:#eef2ff; --dim:#8f9bc4;
  --neon:#38e1ff; --pink:#ff5fd2; --gold:#ffd54a;
  --panel:#141a3c; --panel2:#1c2450; --line:#2a3568;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 800px at 50% -10%, #16205a 0%, var(--bg1) 60%);
  color:var(--txt);
  font-family:"Segoe UI","Hiragino Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;justify-content:center;min-height:100dvh;
  user-select:none;-webkit-user-select:none;
}
#app{width:100%;max-width:470px;min-height:100dvh;display:flex;flex-direction:column;padding:0 10px 14px;}
/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px 8px;position:sticky;top:0;z-index:20;
  background:linear-gradient(#070a1a 70%,rgba(7,10,26,0));}
.brand{font-weight:800;letter-spacing:1px;font-size:17px;line-height:1;}
.brand small{display:block;font-size:10px;color:var(--dim);letter-spacing:2px;margin-top:3px;font-weight:600;}
.brand .n7{color:var(--gold);text-shadow:0 0 12px rgba(255,213,74,.7);}
.hdr-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.hbtn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;
  padding:6px 9px;font-size:12px;cursor:pointer;}
.hbtn.on{border-color:var(--neon);color:var(--neon);box-shadow:0 0 8px rgba(56,225,255,.35);}
/* views */
.view{flex:1;display:flex;flex-direction:column;}
.view[hidden]{display:none;}
/* home */
.creditsBar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:14px;padding:10px 14px;margin:4px 0 12px;}
.creditsBar .cr{font-size:24px;font-weight:800;color:var(--gold);text-shadow:0 0 10px rgba(255,213,74,.4);}
.creditsBar .lbl{font-size:11px;color:var(--dim);letter-spacing:1px;}
.statstrip{display:flex;gap:8px;margin:0 0 12px;}
.statstrip div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:center;}
.statstrip b{display:block;font-size:15px;}
.statstrip span{font-size:10px;color:var(--dim);letter-spacing:.5px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mcard{position:relative;border-radius:14px;padding:10px;border:1px solid rgba(255,255,255,.14);
  min-height:128px;display:flex;flex-direction:column;gap:4px;cursor:pointer;overflow:hidden;}
.mcard:active{transform:scale(.97);}
.mcard .art{font-size:40px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
.mcard .nm{font-weight:800;font-size:13px;letter-spacing:.4px;text-shadow:0 1px 3px #000;}
.mcard .ds{font-size:10.5px;color:rgba(255,255,255,.85);line-height:1.35;text-shadow:0 1px 2px #000;}
.badge{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;letter-spacing:1px;
  padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);}
.mlock{position:absolute;inset:0;background:rgba(4,6,18,.72);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;backdrop-filter:blur(2px);}
.mlock .ic{font-size:26px;}
.mlock .cost{font-size:12px;color:var(--gold);font-weight:700;}
.mlock button{border:1px solid var(--gold);color:var(--gold);background:rgba(0,0,0,.4);
  border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer;}
.mlock .hint{font-size:10px;color:var(--dim);}
.mstat{position:absolute;left:8px;bottom:6px;font-size:9.5px;color:rgba(255,255,255,.75);text-shadow:0 1px 2px #000;}
.home-foot{margin-top:16px;display:flex;gap:8px;align-items:center;justify-content:space-between;color:var(--dim);font-size:10.5px;}
.home-foot button{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;}
.topup{border:1px solid var(--gold)!important;color:var(--gold);background:rgba(255,213,74,.08);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
/* game */
.ghead{display:flex;align-items:center;gap:10px;padding:6px 2px;}
.ghead .t{flex:1;}
.ghead .t .n{font-weight:800;font-size:15px;letter-spacing:.5px;}
.ghead .t .d{font-size:10.5px;color:var(--dim);}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer;}
.cabinet{background:linear-gradient(160deg,#101636,#0a0e24);border:1px solid var(--line);border-radius:16px;
  padding:10px;position:relative;box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 6px 22px rgba(0,0,0,.5);}
.reels{display:flex;gap:6px;justify-content:center;}
.reel{position:relative;width:31.5%;height:calc(var(--sym)*3);overflow:hidden;border-radius:10px;
  background:linear-gradient(#000,#0c1128 18% 82%,#000);box-shadow:inset 0 0 14px #000;}
.strip{will-change:transform;}
.sym{height:var(--sym);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--sym)*.62);line-height:1;}
.sym.hit{background:radial-gradient(circle,rgba(255,213,74,.35),transparent 70%);animation:hitp .55s ease;}
@keyframes hitp{0%{filter:brightness(2.2) drop-shadow(0 0 14px var(--gold));}100%{filter:none;}}
.plines{position:absolute;inset:0;pointer-events:none;z-index:5;}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:800;color:#04121e;
  display:flex;align-items:center;justify-content:center;opacity:.45;transition:all .2s;}
.dot.lit{opacity:1;transform:scale(1.25);box-shadow:0 0 10px currentColor;}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:800;font-size:20px;letter-spacing:1px;
  color:var(--gold);text-shadow:0 0 14px rgba(255,213,74,.8),0 2px 4px #000;pointer-events:none;opacity:0;z-index:8;}
#msg.show{animation:popmsg 1.6s ease forwards;}
@keyframes popmsg{0%{opacity:0;transform:scale(.6);}12%{opacity:1;transform:scale(1.15);}22%{transform:scale(1);}75%{opacity:1;}100%{opacity:0;}}
#msg.bad{color:#ff7b7b;text-shadow:0 0 14px rgba(255,90,90,.8),0 2px 4px #000;}
#msg.mega{font-size:26px;color:#fff;text-shadow:0 0 18px var(--pink),0 0 30px var(--neon);}
.shake{animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
/* panel */
.panel{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.meters{display:flex;gap:8px;}
.meters>div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center;}
.meters label{display:block;font-size:9.5px;color:var(--dim);letter-spacing:1px;margin-bottom:2px;}
.meters b{font-size:17px;}
.meters b.gold{color:var(--gold);}
.betrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;flex:1.4;}
.betrow label{font-size:9.5px;color:var(--dim);letter-spacing:1px;flex:1;}
.betrow b{font-size:17px;color:var(--neon);}
.betrow button{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px;cursor:pointer;}
.btnrow{display:flex;gap:8px;}
.gbtn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:12px;
  padding:11px 6px;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;}
.gbtn.on{border-color:var(--neon);color:var(--neon);box-shadow:0 0 10px rgba(56,225,255,.3);}
#btnSpin{padding:16px;font-size:20px;font-weight:900;letter-spacing:3px;color:#04121e;border:none;border-radius:14px;
  background:linear-gradient(135deg,#ffd54a,#ff9d3c 55%,#ff5fd2);box-shadow:0 4px 18px rgba(255,157,60,.45);}
#btnSpin:disabled{filter:grayscale(.8) brightness(.6);}
.gstats{display:flex;gap:8px;font-size:10px;color:var(--dim);justify-content:center;}
/* overlay */
#ov{position:fixed;inset:0;background:rgba(4,6,18,.82);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
#ov[hidden]{display:none;}
#ovCard{width:100%;max-width:420px;max-height:86dvh;overflow:auto;background:linear-gradient(160deg,#141a3c,#0c1128);
  border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.7);}
#ovCard h2{margin:0 0 10px;font-size:17px;letter-spacing:1px;}
#ovCard h2 .sub{font-size:11px;color:var(--dim);font-weight:600;margin-left:6px;letter-spacing:0;}
.ptbl{width:100%;border-collapse:collapse;font-size:13px;}
.ptbl td{padding:6px 4px;border-bottom:1px solid var(--line);}
.ptbl .s{font-size:20px;}
.ptbl .p{text-align:right;font-weight:700;color:var(--gold);}
.ptbl .sp{text-align:left;color:var(--neon);font-weight:700;font-size:11.5px;}
.note{font-size:11.5px;color:var(--dim);line-height:1.55;margin:10px 0;}
.note b{color:var(--txt);}
.ovfoot{display:flex;gap:8px;margin-top:12px;}
.ovfoot .gbtn{padding:10px;}
/* bonus */
.bcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;}
.bcard{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,#27336e,#141a3c);
  font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--neon);font-weight:800;}
.bcard.rev{background:linear-gradient(135deg,#5a4a12,#141a3c);border-color:var(--gold);flex-direction:column;font-size:20px;}
.bcard.rev small{font-size:11px;color:var(--gold);font-weight:800;}
.bcard.dim{opacity:.35;}
.bcard.pick{box-shadow:0 0 12px var(--gold);}
.atreels{display:flex;gap:8px;justify-content:center;margin:12px 0;}
.atcell{width:74px;height:74px;border-radius:12px;background:#000;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:44px;}
.atinfo{display:flex;justify-content:center;gap:18px;font-size:13px;margin-bottom:10px;}
.atinfo b{color:var(--gold);font-size:17px;}
.bignum{text-align:center;font-size:26px;font-weight:900;color:var(--gold);text-shadow:0 0 14px rgba(255,213,74,.6);margin:8px 0;}
.center{text-align:center;}
.kbd{font-size:10px;color:var(--dim);text-align:center;margin-top:8px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">NEON<span class="n7">777</span>CRUISE<small data-i18n="tag"></small></div>
    <div class="hdr-btns">
      <button class="hbtn" id="btnSound" title="Sound">&#128266;</button>
      <button class="hbtn" id="btnHelp">?</button>
      <button class="hbtn" id="lgJa">日本語</button>
      <button class="hbtn" id="lgEn">EN</button>
      <button class="hbtn" id="lgZh">中文</button>
    </div>
  </header>

  <!-- ======== HOME ======== -->
  <section class="view" id="viewHome">
    <div class="creditsBar">
      <div><span class="lbl" data-i18n="medals"></span><div class="cr" id="hCredits">0</div></div>
      <div id="topupWrap"></div>
    </div>
    <div class="statstrip">
      <div><b id="hSpins">0</b><span data-i18n="st_spins"></span></div>
      <div><b id="hBig">0</b><span data-i18n="st_big"></span></div>
      <div><b id="hBonus">0</b><span data-i18n="st_bonus"></span></div>
    </div>
    <div class="grid" id="mgrid"></div>
    <div class="home-foot">
      <span data-i18n="save_note"></span>
      <button id="btnReset" data-i18n="reset"></button>
    </div>
  </section>

  <!-- ======== GAME ======== -->
  <section class="view" id="viewGame" hidden>
    <div class="ghead">
      <button class="iconbtn" id="btnBack">&#9664;</button>
      <div class="t"><div class="n" id="gName"></div><div class="d" id="gDesc"></div></div>
      <div class="badge" id="gBadge"></div>
    </div>
    <div class="cabinet" id="cabinet">
      <div class="reels" id="reels">
        <div class="reel"><div class="strip"></div><div class="plines"></div></div>
        <div class="reel"><div class="strip"></div><div class="plines"></div></div>
        <div class="reel"><div class="strip"></div><div class="plines"></div></div>
      </div>
      <div id="msg"></div>
    </div>
    <div class="panel">
      <div class="meters">
        <div><label data-i18n="medals"></label><b class="gold" id="gCredits">0</b></div>
        <div><label data-i18n="last_win"></label><b id="gWin">0</b></div>
        <div class="betrow">
          <label data-i18n="bet"></label>
          <button id="btnBetDown">&#8722;</button><b id="gBet">3</b><button id="btnBetUp">&#43;</button>
        </div>
      </div>
      <button id="btnSpin">SPIN</button>
      <div class="btnrow">
        <button class="gbtn" id="btnAuto">AUTO</button>
        <button class="gbtn" id="btnTurbo">TURBO</button>
        <button class="gbtn" id="btnInfo" data-i18n="paytable"></button>
      </div>
      <div class="gstats"><span id="gStat"></span></div>
      <div class="kbd" data-i18n="kbd"></div>
    </div>
  </section>
</div>

<div id="ov" hidden><div id="ovCard"></div></div>

 o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.02);}

/* ================= weights & target generation ================= */
function pickSym(m,boost){
 let set=m.syms;
 if(boost){
  set=m.syms.filter(function(s){return s.e!=="🔄"&&s.e!=="🎰";}).map(function(s){
   return{e:s.e,w:s.p>=85?s.w*4:(s.p<=20?s.w*0.5:s.w*1.2),p:s.p};});
 }
 let tot=0;set.forEach(function(s){tot+=s.w;});
 let x=Math.random()*tot;
 for(let i=0;i<set.length;i++){x-=set[i].w;if(x<=0)return boost?set[i]:set[i];}
 return set[0];
}
function genTargets(m,boost){
 const g=[];for(let r=0;r<3;r++){g.push([pickSym(m,boost),pickSym(m,boost),pickSym(m,boost)]);}
 return g;
}

/* ================= spin flow ================= */
function symH(){const re=$("reels").querySelector(".reel");return re.clientHeight/3;}
let visState=[[],[],[]]; // currently visible symbols per reel (strings)
function animateReels2(targets){
 return new Promise(function(res){
  const m=cur();const strips=$("reels").querySelectorAll(".strip");
  const H=symH();const tb=S.turbo?0.32:1;
  const delays=[];
  strips.forEach(function(st,r){
   const oldVis=visState[r].slice();
   const fillerN=10+r*8+(S.turbo?0:4);
   let html="";
   // old visible on top, then spin fillers, then final 3 at the bottom
   oldVis.forEach(function(e){html+='<div class="sym">'+e+"</div>";});
   for(let i=0;i<fillerN;i++)html+='<div class="sym">'+pickSym(m).e+"</div>";
   targets[r].forEach(function(s){html+='<div class="sym">'+s.e+"</div>";});
   st.style.transition="none";st.style.transform="translateY(0px)";
   st.innerHTML=html;
   void st.offsetWidth;
   const dur=(680+r*400)*tb;
   st.style.transition="transform "+dur+"ms cubic-bezier(.16,.62,.14,1)";
   st.style.transform="translateY(-"+((fillerN+3)*H)+"px)";
   visState[r]=targets[r].map(function(s){return s.e;});
   delays.push(dur);
   setTimeout(sStop,dur);
  });
  setTimeout(res,Math.max.apply(null,delays)+90);
 });
}
async function spin(opts){
 opts=opts||{};
 const m=cur();if(!m||(busy&&!opts.ifree))return; // ifree = internal replay-chain spin
 const bet=betTotal(m);const unit=bet/m.lines.length;
 if(!opts.free){
  if(S.credits<bet){
   $("cabinet").classList.remove("shake");void $("cabinet").offsetWidth;$("cabinet").classList.add("shake");sStop();
   const waitMs=60000-(Date.now()-S.lastTopUp);
   if(waitMs<=0){confirmOv(t("no_medals")+"  +300",function(){S.credits+=300;S.lastTopUp=Date.now();sCoin();save();renderGameStatic();renderHome();});}
   else showToast(t("wait_min",{s:Math.ceil(waitMs/1000)}),"bad");
   autoOn=false;renderGameStatic();return;
  }
  S.credits-=bet;
 }
 busy=true;
 $("btnBack").disabled=true;
 $("btnSpin").disabled=true;
 $("gWin").textContent="0";
 $("gCredits").textContent=S.credits;
 sSpinS();
 // clear old highlights
 $("reels").querySelectorAll(".sym.hit").forEach(function(c){c.classList.remove("hit");});
 $("reels").querySelectorAll(".dot.lit").forEach(function(d){d.classList.remove("lit");});
 const targets=genTargets(m,opts.boost);
 await animateReels2(targets);
 // evaluate
 let win=0;const lineHits=[];
 for(let li=0;li<m.lines.length;li++){
  const ln=m.lines[li];
  const a=targets[0][ln[0]],b=targets[1][ln[1]],c2=targets[2][ln[2]];
  if(a.e===b.e&&b.e===c2.e&&a.p>0){
   win+=a.p*unit;
   lineHits.push({li:li,cells:[[0,ln[0]],[1,ln[1]],[2,ln[2]]]});
  }else{
   // small payout for 2-of-a-kind of LOW symbols on a line (keeps the game lively)
   let psym=null,cells=null;
   if(a.e===b.e&&a.p>0&&a.p<=30){psym=a;cells=[[0,ln[0]],[1,ln[1]]];}
   else if(a.e===c2.e&&a.p>0&&a.p<=30){psym=a;cells=[[0,ln[0]],[2,ln[2]]];}
   else if(b.e===c2.e&&b.p>0&&b.p<=30){psym=b;cells=[[1,ln[1]],[2,ln[2]]];}
   if(psym){win+=Math.max(1,Math.round(psym.p/20))*unit;lineHits.push({li:li,cells:cells});}
  }
 }
 // REG / BONUS anywhere
 let regHit=false,bonusHit=false;
 for(let r=0;r<3;r++){
  const a=targets[0][r].e,b=targets[1][r].e,c2=targets[2][r].e;
  if(a==="🔄"&&b==="🔄"&&c2==="🔄")regHit=true;
  if(a==="🎰"&&b==="🎰"&&c2==="🎰")bonusHit=true;
 }
 // highlight
 lineHits.forEach(function(h){
  h.cells.forEach(function(cr){
   const st=$("reels").querySelectorAll(".strip")[cr[0]];
   const idx=st.children.length-3+cr[1];
   if(st.children[idx])st.children[idx].classList.add("hit");
  });
  $("reels").querySelectorAll(".plines").forEach(function(pl){
   pl.querySelectorAll('.dot[data-li="'+h.li+'"]').forEach(function(d){d.classList.add("lit");});
  });
 });
 // mega jack rare
 let jp=false;
 if(!opts.free&&Math.random()<1/1500){win+=40*bet;jp=true;}
 if(win>0){
  S.credits+=win;S.stats.won+=win;
  if(win>S.stats.big)S.stats.big=win;
  msAdd(m.id,"big",win);
  $("gWin").textContent=win;
  if(jp){showToast(t("mega"),"mega");sJack();}
  else if(win>=6*bet){showToast(t("bigwin"),"mega");sWinB();}
  else if(win>=2*bet){showToast("+"+win,"");sWinB();}
  else{showToast("+"+win,"");sWinS();}
 }
 if(!opts.free){S.stats.spins++;msAdd(m.id,"spins",1);}
 // REG
 if(regHit){
  regChain=Math.min(regChain+1,12);
  const back=(m.type==="RJ"?2:1)*bet;
  S.credits+=back;S.stats.won+=back;
  showToast(t("reg_chain",{n:regChain}),"");sCoin();
 }else regChain=0;
 // BONUS
 if(bonusHit&&!opts.free){
  S.stats.bonus++;msAdd(m.id,"bonus",1);save();
  await sleep(700);
  showToast(t("bonus_in"),"mega");sBonus();
  await sleep(900);
  if(m.type==="BB"){
   const bw=await bbGame(bet);
   if(bw>0){S.credits+=bw;S.stats.won+=bw;msAdd(m.id,"big",bw);
    $("gWin").textContent=win+bw;$("gCredits").textContent=S.credits;}
  }else if(m.type==="AT"){await atGame(m,bet,bet/m.lines.length);}
 }
 $("gCredits").textContent=S.credits;
 save();
 // replay: instant free spin (busy stays true across the chain)
 if(regHit&&regChain<12){await sleep(850);if(cur())await spin({free:true,ifree:true});return;}
 busy=false;
 $("btnBack").disabled=false;
 $("btnSpin").disabled=false;
 renderGameStatic();
 // auto loop
 if(autoOn){
  autoLeft--;
  if(autoLeft>0&&S.credits>=bet){await sleep(S.turbo?220:650);await spin();}
  else{autoOn=false;renderGameStatic();}
 }
}
function msAdd(id,key,val){const ms=S.mstats[id]=S.mstats[id]||{spins:0,big:0,bonus:0};
 if(key==="big"){if(val>ms.big)ms.big=val;}else ms[key]=(ms[key]||0)+val;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

/* ================= overlay ================= */
function openOv(html){$("ovCard").innerHTML=html;$("ov").hidden=false;}
function closeOv(){$("ov").hidden=true;$("ovCard").innerHTML="";}

/* ---- paytable ---- */
function showPaytable(){
 const m=cur();const bet=betTotal(m);const unit=bet/m.lines.length;
 let rows="";
 m.syms.forEach(function(s){
  if(s.e==="🔄"){rows+='<tr><td class="s">🔄🔄🔄</td><td class="sp">'+t(m.type==="RJ"?"reg_txt2":"reg_txt",{m:(m.type==="RJ"?2:1)*bet})+"</td></tr>";return;}
  if(s.e==="🎰"){rows+='<tr><td class="s">🎰🎰🎰</td><td class="sp">'+t("bonus_txt")+"</td></tr>";return;}
  rows+='<tr><td class="s">'+s.e+s.e+s.e+"</td><td>"+t("pay3")+'</td><td class="p">'+(s.p*unit)+"</td></tr>";
 });
 openOv("<h2>"+m.name+'<span class="sub">'+t("paytable")+'</span></h2>'+
  '<div class="note">'+t("unit_note",{bet:bet,unit:unit})+" · "+m.lines.length+" LINES<br>"+t("pt_pairs")+"</div>"+
  '<table class="ptbl"><tbody>'+rows+"</tbody></table>"+
  '<div class="note"><b>'+t("type_"+m.type)+":</b> "+t("rules_"+m.type)+"</div>"+
  '<div class="ovfoot"><button class="gbtn" id="ovClose">'+t("close")+"</button></div>");
 $("ovClose").onclick=function(){closeOv();sClick();};
}
/* ---- help ---- */
function showHelp(){
 openOv("<h2>"+t("help_t")+"</h2><div class='note'>"+t("h1")+"<br>"+t("h2")+"<br>"+t("h3")+"<br>"+t("h4")+"</div>"+
  '<div class="note">'+t("lang_note")+"</div>"+
  '<div class="ovfoot"><button class="gbtn" id="ovClose">'+t("close")+"</button></div>");
 $("ovClose").onclick=function(){closeOv();sClick();};
}
/* ---- confirm ---- */
function confirmOv(txt,cb){
 openOv("<h2>⚠</h2><div class='note'>"+txt+"</div><div class='ovfoot'>"+
  "<button class='gbtn' id='ovYes'>"+t("yes")+"</button><button class='gbtn' id='ovNo'>"+t("no")+"</button></div>");
 $("ovYes").onclick=function(){closeOv();cb();};
 $("ovNo").onclick=function(){closeOv();sClick();};
}

/* ---- BIG BONUS card game ---- */
function bbGame(bet){
 return new Promise(function(res){
  const vals=[{x:0,e:"💩"},{x:0,e:"💩"},{x:1,e:"💵"},{x:1,e:"💵"},{x:2,e:"🎁"},{x:2,e:"🎁"},
   {x:3,e:"⭐"},{x:4,e:"🎯"},{x:5,e:"💰"},{x:6,e:"💰"},{x:10,e:"💎"},{x:40,e:"🎰"}];
  // shuffle
  for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=vals[i];vals[i]=vals[j];vals[j]=tmp;}
  openOv("<h2>"+t("bb_t")+'<span class="sub">BET '+bet+"</span></h2><div class='note'>"+t("bb_h")+"</div>"+
   '<div class="bcards" id="bcards"></div><div class="bignum" id="bbSum"></div>'+
   '<div class="ovfoot" id="bbFoot"></div>');
  let picks=0,sum=0;
  const wrap=$("bcards");
  vals.forEach(function(v,i){
   const c=document.createElement("div");c.className="bcard";c.textContent="?";
   c.onclick=function(){
    if(picks>=3||c.classList.contains("rev"))return;
    picks++;sum+=v.x;sPick();
    c.classList.add("rev");c.innerHTML=v.e+"<small>×"+v.x+"</small>";
    if(v.x>=10){c.classList.add("pick");sWinB();}
    if(picks>=3){
     $("bcards").querySelectorAll(".bcard").forEach(function(b){if(!b.classList.contains("rev"))b.classList.add("dim");});
     const won=sum*bet;
     $("bbSum").textContent=t("bb_r")+": "+won;
     const f=$("bbFoot");f.innerHTML='<button class="gbtn" id="bbGo">'+t("collect")+" : +"+won+"</button>";
     $("bbGo").onclick=function(){closeOv();if(sum>0){sWinB();}else sClick();res(won);};
    }
   };
   wrap.appendChild(c);
  });
 });
}
/* ---- ASSIST TIME free spins ---- */
function atGame(m,bet,unit){
 return new Promise(function(res){
  const total=10;let left=total,acc=0;
  openOv("<h2>"+t("at_t")+'<span class="sub">'+total+" x BET</span></h2>"+
   "<div class='note'>"+t("at_h")+"</div>"+
   '<div class="atreels" id="atR"><div class="atcell">·</div><div class="atcell">·</div><div class="atcell">·</div></div>'+
   '<div class="atinfo"><span>'+t("at_left")+' <b id="atL">'+left+"</b></span><span>"+t("at_total")+' <b id="atT">0</b></span></div>'+
   '<div class="ovfoot" id="atFoot"><button class="gbtn" id="atGo">'+t("spin_txt")+"</button></div>");
  const cells=$("atR").children;
  function go(){
   if(left<=0)return;
   const row=[pickSym(m,true),pickSym(m,true),pickSym(m,true)];
   for(let i=0;i<3;i++){cells[i].textContent=row[i].e;cells[i].style.transform="scale(1.15)";setTimeout((function(el){return function(){el.style.transform="";};})(cells[i]),150);}
   sSpinS();
   let gain=0;
   if(row[0].e===row[1].e&&row[1].e===row[2].e&&row[0].p>0)gain=Math.round(row[0].p*unit*1.6);
   else{
    let psym=null;
    if(row[0].e===row[1].e&&row[0].p>0&&row[0].p<=30)psym=row[0];
    else if(row[0].e===row[2].e&&row[0].p>0&&row[0].p<=30)psym=row[0];
    else if(row[1].e===row[2].e&&row[1].p>0&&row[1].p<=30)psym=row[1];
    if(psym)gain=Math.max(1,Math.round(psym.p/20));
   }
   left--;acc+=gain;
   if(gain>0){S.credits+=gain;S.stats.won+=gain;msAdd(m.id,"big",gain);setTimeout(sWinS,220);}else setTimeout(sStop,200);
   $("atL").textContent=left;$("atT").textContent=acc;
   $("gCredits").textContent=S.credits;
   if(left<=0){
    $("atGo").disabled=true;$("atGo").textContent=t("at_t")+" END";
    const f=$("atFoot");f.innerHTML="";
    const b=document.createElement("button");b.className="gbtn";b.textContent=t("collect")+" : +"+acc;
    b.onclick=function(){closeOv();if(acc>0)sWinB();res(acc);};f.appendChild(b);
   }else setTimeout(go,S.turbo?250:520);
  }
  $("atGo").onclick=go;
 });
}

$("btnSpin").onclick=function(){sClick();if(!busy)spin();};
$("btnAuto").onclick=function(){
 sClick();
 if(autoOn){autoOn=false;}
 else{autoOn=true;autoLeft=100;if(!busy)spin();}
 renderGameStatic();
};
$("btnTurbo").onclick=function(){S.turbo=!S.turbo;save();sClick();renderGameStatic();};
$("btnInfo").onclick=function(){sClick();showPaytable();};
$("btnBack").onclick=function(){sClick();autoOn=false;goHome();};
$("btnBetDown").onclick=function(){const m=cur();if(!m||busy)return;const u=m.units;let i=u.indexOf(betOf(m));i=Math.max(0,i-1);S.bets[m.id]=u[i];save();sClick();renderGameStatic();};
$("btnBetUp").onclick=function(){const m=cur();if(!m||busy)return;const u=m.units;let i=u.indexOf(betOf(m));i=Math.min(u.length-1,i+1);S.bets[m.id]=u[i];save();sClick();renderGameStatic();};
$("btnHelp").onclick=function(){sClick();showHelp();};
$("btnReset").onclick=function(){sClick();confirmOv(t("reset_q"),function(){try{localStorage.removeItem(LS_KEY);}catch(e){}S=defSave();autoOn=false;curId=null;closeOv();goHome();applyLang();});};
function setLang(l){S.lang=l;save();sClick();applyLang();}
$("lgJa").onclick=function(){setLang("ja");};
$("lgEn").onclick=function(){setLang("en");};
$("lgZh").onclick=function(){setLang("zh");};
$("btnSound").onclick=function(){S.sound=!S.sound;save();if(S.sound){ac();sCoin();}updSound();};
function updSound(){$("btnSound").innerHTML=S.sound?"&#128266;":"&#128263;";$("btnSound").classList.toggle("on",S.sound);}
document.addEventListener("keydown",function(e){
 if(viewGameHidden())return;
 if(e.code==="Space"||e.key==="s"||e.key==="S"){e.preventDefault();if(!busy&&!($("ov").hidden===false))spin();}
});
// unlock audio on first touch
document.addEventListener("pointerdown",function once(){ac();document.removeEventListener("pointerdown",once);});

/* ================= boot ================= */
applyLang();updSound();
</script>
